name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Generates the missing Android project files (keeps our lib/ and manifest)
      - run: flutter create --platforms=android --org com.konzola --project-name konzola .
      - run: rm -rf test

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: konzola-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Easy download on the phone: Releases → "latest" → app-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
