name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Generates the missing Android project files (keeps our lib/ and manifest)
      - run: flutter create --platforms=android --org com.konzola --project-name konzola .
      - run: rm -rf test
      - name: Install app icon
        run: cp -r branding/res/. android/app/src/main/res/

      # Sign with the permanent upload key (password in repo secret KEYSTORE_PASSWORD).
      # Without the secret the build still works, signed with a temporary debug key.
      - name: Configure release signing
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "No KEYSTORE_PASSWORD secret - using debug key"; exit 0; fi
          cp signing/upload.jks android/app/upload.jks
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          s = s.replace('android {', '''android {
              signingConfigs {
                  create("release") {
                      storeFile = file("upload.jks")
                      storePassword = System.getenv("KS_PASS")
                      keyAlias = "upload"
                      keyPassword = System.getenv("KS_PASS")
                  }
              }''', 1)
          assert 'signingConfigs.getByName("debug")' in s, 'gradle template changed'
          s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
          open(p, 'w').write(s)
          PY

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: konzola-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Easy download on the phone: Releases → "latest" → app-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
